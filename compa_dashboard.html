<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6366f1">
<title>Stay4Compa -- Agent Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;color:#fff;padding-bottom:20px}
.header{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:20px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:1.3em}
.header p{color:rgba(255,255,255,0.8);font-size:0.75em;margin-top:3px}
.back{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#fff;text-decoration:none;font-size:1.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:600px;margin:0 auto}
.card{background:#11112a;border-radius:12px;padding:15px;border:1px solid #1e293b}
.card h2{color:#8b5cf6;font-size:1em;margin-bottom:10px}
.card .count{font-size:1.8em;font-weight:bold;color:#6366f1}
.card .label{color:#94a3b8;font-size:0.75em}
.chat-box{max-width:600px;margin:15px auto;background:#11112a;border-radius:12px;padding:15px;border:1px solid #1e293b}
.chat-box h2{color:#8b5cf6;margin-bottom:12px;font-size:1em}
#messages{height:280px;overflow-y:auto;background:#0a0a1a;border-radius:8px;padding:12px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.msg{margin-bottom:8px;padding:10px;border-radius:8px;max-width:85%;word-wrap:break-word;font-size:0.9em}
.msg.user{background:#6366f1;color:#fff;margin-left:auto}
.msg.bot{background:#1e293b;color:#cbd5e1}
.msg .tool{font-size:0.75em;color:#f59e0b;margin-top:5px}
.msg .time{font-size:0.65em;color:#64748b;margin-top:3px}
.typing{color:#64748b;font-style:italic}
#chat-input{display:flex;gap:8px}
#chat-input input{flex:1;background:#0a0a1a;border:1px solid #334155;border-radius:8px;color:#fff;padding:12px;font-family:inherit;font-size:0.9em}
#chat-input button{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:0.9em;white-space:nowrap}
#chat-input button:active{background:#5457e6}
.tools-list{display:flex;flex-wrap:wrap;gap:6px}
.tool-badge{background:rgba(99,102,241,0.2);color:#8b5cf6;padding:3px 10px;border-radius:20px;font-size:0.7em}
table{width:100%;border-collapse:collapse;font-size:0.8em}
th{text-align:left;color:#94a3b8;padding:6px;border-bottom:1px solid #1e293b}
td{padding:6px;border-bottom:1px solid #1e293b;color:#cbd5e1}
.full{grid-column:1/3}
.footer{text-align:center;padding:15px;color:#475569;font-size:0.7em}
@media(max-width:400px){.grid{grid-template-columns:1fr}.full{grid-column:1}}
</style>
</head>
<body>
<div class="header">
<a href="/" class="back"><</a>
<h1>Stay4Compa</h1>
<p>Eigen AI agent -- Versleuteld</p>
</div>
<div class="grid">
<div class="card">
<h2>Statistieken</h2>
<div id="stats"><p>Laden...</p></div>
</div>
<div class="card">
<h2>Tools</h2>
<div id="tools" class="tools-list"><p>Laden...</p></div>
</div>
<div class="card">
<h2>Gesprekken</h2>
<div id="conversations"><p>Laden...</p></div>
</div>
<div class="card">
<h2>Klanten</h2>
<div id="customers"><p>Laden...</p></div>
</div>
<div class="card full">
<h2>Workflows</h2>
<div id="workflows"><p>Laden...</p></div>
</div>
</div>
<div class="chat-box">
<h2>Chat met Stay4Compa</h2>
<div id="messages">
<div class="msg bot">Hallo! Ik ben Stay4Compa, je eigen AI-assistent. Waar kan ik je mee helpen?</div>
</div>
<div id="chat-input">
<input id="msg-input" type="text" placeholder="Typ je bericht..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">Verzend</button>
</div>
</div>
<div class="footer">
<p>Stay4S | KvK 86200860 | Pi 5 -- Ollama qwen3:1.7b</p>
</div>
<script>
async function loadStats(){
try{
const r=await fetch("/customers");const c=await r.json();
const r2=await fetch("/conversations?limit=10000");const conv=await r2.json();
const r3=await fetch("/tools");const t=await r3.json();
document.getElementById("stats").innerHTML=
"<div class='count'>"+(conv.conversations?.length||0)+"</div><div class='label'>Gesprekken</div>"+
"<div class='count' style='margin-top:8px'>"+(c.customers?.length||0)+"</div><div class='label'>Klanten</div>"+
"<div class='count' style='margin-top:8px'>"+(t.tools?.length||0)+"</div><div class='label'>Tools</div>";
document.getElementById("tools").innerHTML=t.tools?.map(x=>"<span class='tool-badge'>"+x.name+"</span>").join("")||"geen";
document.getElementById("conversations").innerHTML=(conv.conversations||[]).slice(0,5).map(c=>
"<div style='padding:6px;border-bottom:1px solid #1e293b'><b>"+(c.customer_name||"?")+"</b>: "+(c.message||"").substring(0,40)+"</div>"
).join("")||"geen";
document.getElementById("customers").innerHTML=(c.customers||[]).map(c=>
"<div style='padding:6px;border-bottom:1px solid #1e293b'><b>"+c.name+"</b> ("+c.plan+")</div>"
).join("")||"geen klanten";
document.getElementById("workflows").innerHTML="<span class='tool-badge'>daily_report</span><span class='tool-badge'>health_monitor</span><span class='tool-badge'>conversation_mining</span>";
}catch(e){document.getElementById("stats").innerHTML="<p>Error</p>";}
}
async function sendMsg(){
const input=document.getElementById("msg-input");
const text=input.value.trim();if(!text)return;
input.value="";
const msgs=document.getElementById("messages");
const userDiv=document.createElement("div");userDiv.className="msg user";userDiv.textContent=text;
msgs.appendChild(userDiv);
const botDiv=document.createElement("div");botDiv.className="msg bot";botDiv.innerHTML="<span class='typing'>Denken...</span>";
msgs.appendChild(botDiv);msgs.scrollTop=msgs.scrollHeight;
try{
const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
const data=await r.json();
botDiv.textContent=data.response||"[geen antwoord]";
if(data.tools_used&&data.tools_used.length){
const t=document.createElement("div");t.className="tool";t.textContent="Tools: "+data.tools_used.join(", ");
botDiv.appendChild(t);
}
}catch(e){botDiv.textContent="Error: "+e;}
msgs.scrollTop=msgs.scrollHeight;
loadStats();
}
loadStats();
setInterval(loadStats,30000);
</script>
</body>
</html>

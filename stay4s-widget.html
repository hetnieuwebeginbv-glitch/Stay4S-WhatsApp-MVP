<!-- Stay4S AI Chat Widget - embed op stay4s.com -->
<!-- Voeg dit toe voor </body> op elke pagina -->
<script>
(function() {
  const TUNNEL_URL = "https://blast-wifi-isolated-retention.trycloudflare.com";
  const widget = document.createElement("div");
  widget.id = "stay4s-widget";
  widget.innerHTML = `
    <style>
      #stay4s-bubble {
        position: fixed; bottom: 24px; right: 24px; z-index: 99999;
        width: 64px; height: 64px; border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 4px 20px rgba(99,102,241,0.4);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: transform 0.2s; animation: stay4s-pulse 2s infinite;
      }
      #stay4s-bubble:hover { transform: scale(1.1); }
      #stay4s-bubble svg { width: 30px; height: 30px; fill: white; }
      @keyframes stay4s-pulse {
        0%,100% { box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
        50% { box-shadow: 0 4px 30px rgba(99,102,241,0.7); }
      }
      #stay4s-chat {
        position: fixed; bottom: 100px; right: 24px; z-index: 99999;
        width: 380px; height: 520px; max-height: 70vh;
        background: #fff; border-radius: 16px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.15);
        display: none; flex-direction: column; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #stay4s-chat.open { display: flex; animation: stay4s-slide 0.3s; }
      @keyframes stay4s-slide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      #stay4s-header {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white; padding: 16px; display: flex; align-items: center; gap: 12px;
      }
      #stay4s-header .logo {
        width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.2);
        display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;
      }
      #stay4s-header .title { font-size: 15px; font-weight: 600; }
      #stay4s-header .status { font-size: 12px; opacity: 0.8; }
      #stay4s-header .close {
        margin-left: auto; cursor: pointer; font-size: 20px; opacity: 0.7;
      }
      #stay4s-header .close:hover { opacity: 1; }
      #stay4s-messages {
        flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        background: #f8f9fa;
      }
      .stay4s-msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
      .stay4s-msg.bot { background: #e8eaff; color: #1a1a2e; border-bottom-left-radius: 4px; align-self: flex-start; }
      .stay4s-msg.user { background: #6366f1; color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
      .stay4s-msg.typing { color: #999; font-style: italic; }
      #stay4s-input-area {
        padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; background: white;
      }
      #stay4s-input {
        flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 16px;
        font-size: 14px; outline: none; font-family: inherit;
      }
      #stay4s-input:focus { border-color: #6366f1; }
      #stay4s-send {
        background: #6366f1; color: white; border: none; border-radius: 50%;
        width: 40px; height: 40px; cursor: pointer; display: flex;
        align-items: center; justify-content: center; flex-shrink: 0;
      }
      #stay4s-send:hover { background: #5457e6; }
      #stay4s-send svg { width: 18px; height: 18px; fill: white; }
      .stay4s-brand { text-align: center; padding: 6px; font-size: 11px; color: #999; background: white; }
      .stay4s-brand a { color: #6366f1; text-decoration: none; }
    </style>
    <div id="stay4s-bubble" onclick="document.getElementById('stay4s-chat').classList.toggle('open')">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>
    <div id="stay4s-chat">
      <div id="stay4s-header">
        <div class="logo">S4</div>
        <div>
          <div class="title">Stay4S AI</div>
          <div class="status">Online - Privacy-first</div>
        </div>
        <div class="close" onclick="document.getElementById('stay4s-chat').classList.remove('open')">&times;</div>
      </div>
      <div id="stay4s-messages">
        <div class="stay4s-msg bot">Hallo! Ik ben Stay4S AI, uw Nederlandse privacy-first assistent. Waar kan ik u mee helpen?</div>
      </div>
      <div id="stay4s-input-area">
        <input id="stay4s-input" type="text" placeholder="Typ uw bericht..." onkeypress="if(event.key==='Enter')stay4sSend()">
        <button id="stay4s-send" onclick="stay4sSend()">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
      <div class="stay4s-brand">Powered by <a href="https://stay4s.com" target="_blank">Stay4S</a> - Eigen AI, eigen infra</div>
    </div>
  `;
  document.body.appendChild(widget);
  const input = document.getElementById("stay4s-input");
  const messages = document.getElementById("stay4s-messages");
  async function stay4sSend() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const userMsg = document.createElement("div");
    userMsg.className = "stay4s-msg user";
    userMsg.textContent = text;
    messages.appendChild(userMsg);
    messages.scrollTop = messages.scrollHeight;
    const typing = document.createElement("div");
    typing.className = "stay4s-msg bot typing";
    typing.textContent = "Een moment, ik zoek het voor je op...";
    typing.id = "stay4s-typing";
    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;
    try {
      const resp = await fetch(TUNNEL_URL + "/widget", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await resp.json();
      typing.remove();
      const botMsg = document.createElement("div");
      botMsg.className = "stay4s-msg bot";
      botMsg.textContent = data.reply || "Sorry, er ging iets mis. Probeer het opnieuw.";
      messages.appendChild(botMsg);
    } catch (e) {
      typing.remove();
      const errMsg = document.createElement("div");
      errMsg.className = "stay4s-msg bot";
      errMsg.textContent = "Sorry, ik kan nu niet antwoorden. Probeert u het later opnieuw of mail naar stay4ai@gmail.com";
      messages.appendChild(errMsg);
    }
    messages.scrollTop = messages.scrollHeight;
  }
  window.stay4sSend = stay4sSend;
})();
</script>
